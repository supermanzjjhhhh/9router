name: Build Qoder CN caps image

# Fork-only. Builds 9router 0.5.104 + the .1 context_config patch + the .2
# Qoder CN capability patch, and pushes it to GHCR. It does NOT touch
# production: the deployment swap is the operator's call.
#
# TRIGGERS
#   - push of a tag matching `qoder-caps-*`: this is the path used from a
#     feature branch, because `workflow_dispatch` only offers workflows that
#     exist on the default branch (master) and we do not modify master.
#   - manual dispatch once this file lands on master.
#
# arm64 only: the deployed host is aarch64, and the npm artifact + patches are
# architecture-independent, so an amd64 build would only cost minutes.
on:
  push:
    tags:
      - "qoder-caps-*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag to push (qoder-cn-caps.2 unless superseding)"
        required: true
        default: "qoder-cn-caps.2"

permissions:
  contents: read
  packages: write

concurrency:
  group: qoder-cn-caps-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag pushes carry no inputs, so derive the tag from the ref.
      - name: Resolve image tag
        id: meta
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            tag="${{ inputs.image_tag }}"
          else
            tag="${GITHUB_REF_NAME#qoder-caps-}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $tag"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.qoder-cn-caps
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.tag }}
          build-args: |
            VCS_REF=${{ github.sha }}
          provenance: false
          sbom: false
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:qoder-cn-caps-buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:qoder-cn-caps-buildcache,mode=max

      - name: Report digest
        run: |
          docker buildx imagetools inspect \
            "ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.tag }}"
