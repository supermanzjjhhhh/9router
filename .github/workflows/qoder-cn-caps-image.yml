name: Build Qoder CN caps image

# Fork-only, manual. Builds the artifact-patch image on top of the exact
# production base and pushes it to GHCR. Does NOT touch production: the
# deployment swap is the operator's call.
#
# Why arm64-only: the deployed host is aarch64 (Ory Linux on ARM), and the base
# image export is arm64. Emulating amd64 here would add minutes for an image
# nothing runs.
on:
  workflow_dispatch:
    inputs:
      base_image:
        description: "Exact production image export (must contain the .1 patch)"
        required: true
        default: "ghcr.io/supermanzjjhhhh/9router:qoder-context-base-20261021"
      image_tag:
        description: "Tag to push (qoder-cn-caps.2 unless superseding)"
        required: true
        default: "qoder-cn-caps.2"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The whole premise is "same bits as production plus one table". Assert
      # the base really is that export before spending a build on it, so a
      # mistyped/missing base fails here instead of shipping a wrong image.
      - name: Verify base image carries the .1 patch
        env:
          BASE_IMAGE: ${{ inputs.base_image }}
        run: |
          set -eu
          docker pull --platform linux/arm64 "$BASE_IMAGE"
          cid="$(docker create --platform linux/arm64 "$BASE_IMAGE")"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for root in /app /usr/local/lib/node_modules/9router/app; do
            docker run --rm --platform linux/arm64 --entrypoint node "$BASE_IMAGE" \
              -e "process.exit(require('$root/package.json').version === '0.5.104' ? 0 : 1)"
            # .1 patch marker: object-shaped context_config adapter
            docker run --rm --platform linux/arm64 --entrypoint grep "$BASE_IMAGE" \
              -q 'b=Object.entries(b)' "$root/.next-cli-build/server/chunks/5330.js"
          done

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.qoder-cn-caps
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ inputs.image_tag }}
          build-args: |
            VCS_REF=${{ github.sha }}
            BASE_IMAGE=${{ inputs.base_image }}
          provenance: false
          sbom: false
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:qoder-cn-caps-buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:qoder-cn-caps-buildcache,mode=max

      - name: Report digest
        run: |
          docker buildx imagetools inspect \
            "ghcr.io/${{ github.repository }}:${{ inputs.image_tag }}"
