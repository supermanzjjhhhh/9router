services:
  9router:
    build:
      context: .
      dockerfile: Dockerfile.qoder-context
    image: 9router:0.5.104-qoder-context.1
    container_name: 9router
    networks:
      - default
      - router-link
    restart: always
    stop_grace_period: 30s
    mem_limit: 512m
    memswap_limit: 512m
    ports:
      - "20128:20128"
    volumes:
      - "${NINE_ROUTER_DATA_DIR:-/home/opc/.9router}:/app/data"
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      TZ: Asia/Shanghai
      BASE_URL: http://localhost:20128
      NODE_OPTIONS: "--max-old-space-size=350"
      QODER_CONTEXT_TIER: "1M"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:20128/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  router-link:
    external: true
    name: omni-router-link
